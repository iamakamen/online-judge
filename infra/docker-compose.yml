x-backend: &backend
  build:
    context: ..
    dockerfile: backend/Dockerfile
  image: online-judge-backend:dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: online_judge
      POSTGRES_USER: online_judge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U online_judge -d online_judge"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    <<: *backend
    working_dir: /app
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://online_judge:${POSTGRES_PASSWORD:-dev_password_change_me}@postgres:5432/online_judge
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    env_file:
      - ../.env
    command:
      [
        "uvicorn",
        "backend.app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    environment:
      DATABASE_URL: postgresql+psycopg://online_judge:${POSTGRES_PASSWORD:-dev_password_change_me}@postgres:5432/online_judge
      REDIS_URL: redis://redis:6379/0?decode_responses=true
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "30"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  submission-worker:
    <<: *backend
    working_dir: /app
    command:
      [
        "python",
        "-m",
        "backend.app.services.execution.submission_worker",
      ]
    environment:
      DATABASE_URL: postgresql+psycopg://online_judge:${POSTGRES_PASSWORD:-dev_password_change_me}@postgres:5432/online_judge
      REDIS_URL: redis://redis:6379/0?decode_responses=true
      SUBMISSION_WORKER_NAME: submission-worker-1
      SUBMISSION_RECONCILIATION_INTERVAL_SECONDS: "5"
      SUBMISSION_RECONCILIATION_BATCH_SIZE: "50"
      TMPDIR: /opt/online-judge/runtime/workspaces
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/online-judge/runtime/workspaces:/opt/online-judge/runtime/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
